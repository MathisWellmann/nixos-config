apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ate-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: ate-api-server
    spec:
      containers:
        - args:
            - --grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
            - --authentication-config=/etc/ateapi/authentication/authentication.yaml
            - --postgres-connection-string=@env
            - --postgres-schema=@env
            - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
            - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
            - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
            - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
            - --drain-delay=13s
            - --drain-timeout=15s
          env:
            - name: ATE_STORAGE_BACKEND
              value: s3
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
          envFrom:
            - configMapRef:
                name: ate-otel-config
            - configMapRef:
                name: ate-api-server-envvars
            - secretRef:
                name: ate-api-server-secret-envvars
            - secretRef:
                name: rustfs-s3-credentials
          image: de-msa2:2999/mathiswellmann/ateapi:dc1f263076d1@sha256:4d925c45088b88142aac00c726c796e803851d3fc2578225fc891327d14a8203
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          name: ate-api-server
          ports:
            - containerPort: 443
            - containerPort: 9090
              name: prometheus
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 2
          startupProbe:
            failureThreshold: 24
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 5
          volumeMounts:
            - mountPath: /run/servicedns.podcert.ate.dev
              name: servicedns
            - mountPath: /run/podidentity.podcert.ate.dev
              name: podidentity
            - mountPath: /run/actor-id-jwt-pool
              name: actor-id-jwt-pool
            - mountPath: /run/actor-id-ca-pool
              name: actor-id-ca-pool
              readOnly: true
            - mountPath: /etc/ateapi/authentication
              name: authentication-config
              readOnly: true
            - mountPath: /run/postgres-server-ca
              name: postgres-server-ca
              readOnly: true
      serviceAccountName: ate-api-server
      terminationGracePeriodSeconds: 40
      volumes:
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  credentialBundlePath: credential-bundle.pem
                  keyType: ECDSAP256
                  signerName: servicedns.podcert.ate.dev/identity
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  credentialBundlePath: credential-bundle.pem
                  keyType: ECDSAP256
                  signerName: podidentity.podcert.ate.dev/identity
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: podidentity.podcert.ate.dev/identity
        - name: actor-id-jwt-pool
          projected:
            sources:
              - secret:
                  items:
                    - key: pool
                      path: pool.json
                  name: actor-id-jwt-pool
        - name: actor-id-ca-pool
          projected:
            sources:
              - secret:
                  items:
                    - key: pool
                      path: pool.json
                  name: actor-id-ca-pool
        - configMap:
            name: ate-api-authentication
          name: authentication-config
        - name: postgres-server-ca
          secret:
            optional: true
            secretName: postgres-server-ca
