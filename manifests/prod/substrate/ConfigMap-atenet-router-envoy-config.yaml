apiVersion: v1
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          # ipv4_compat keeps `kubectl port-forward` to the admin port working;
          # in-pod callers dial localhost and need no help.
          address: "::"
          ipv4_compat: true
          port_value: 9901

    node:
      id: substrate-envoy-node
      cluster: substrate-router-cluster

    # Required for main_internal (see xds.go's buildMainInternalListener):
    # Envoy rejects any Listener.internal_listener without this registered,
    # with "InternalListener bootstrap extension is mandatory".
    bootstrap_extensions:
    - name: envoy.bootstrap.internal_listener
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener

    dynamic_resources:
      lds_config:
        resource_api_version: V3
        ads: {}
      cds_config:
        resource_api_version: V3
        ads: {}
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster

    static_resources:
      clusters:
      - name: xds_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 18000
kind: ConfigMap
metadata:
  name: atenet-router-envoy-config
  namespace: ate-system
