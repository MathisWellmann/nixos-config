apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
  name: ax-server
  namespace: ax-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
    spec:
      containers:
        - args:
            - --addr=:8080
            - --redis-addr=ax-redis.ax-system.svc.cluster.local:6379
            - --substrate-endpoint=api.ate-system.svc.cluster.local:443
            - --substrate-authority=api.ate-system.svc
            - --substrate-token-file=/var/run/secrets/ateapi/token
            - --substrate-ca-file=/run/servicedns-ca/trust-bundle.pem
            - --template=default-template
            - --template-atespace=ax-system
          env:
            - name: ATENET_ROUTER_ADDR
              value: atenet-router.ate-system.svc.cluster.local:80
            - name: AX_SNAPSHOTS_BUCKET
              value: gs://ate-snapshots/ax/
            - name: AX_DEFAULT_TASK_IMAGE
              value: forgejo.k3s.lan/mathiswellmann/ax-task-runner@sha256:f7c16c628d2431cfdbbfb104d9ec435ea35ed2d6ad1cf9e1a6ca7e25e10c3fe4
          image: de-msa2:2999/mathiswellmann/ax-server:ac2332829f22@sha256:e5f2c529a3dabd69d414dfb0ee3a6db0ad56953948e5965d2e4bc4e8e16f71ba
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          name: ax-server
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      serviceAccountName: ax-server
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
