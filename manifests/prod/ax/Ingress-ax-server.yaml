apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: k3s-lan-ca
    gethomepage.dev/description: AX agent tasks (gRPC API)
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/icon: mdi-robot-industrial
    gethomepage.dev/name: ax
    gethomepage.dev/siteMonitor: http://ax-server.ax-system.svc.cluster.local:8080/healthz
  name: ax-server
  namespace: ax-system
spec:
  ingressClassName: traefik
  rules:
    - host: ax.k3s.lan
      http:
        paths:
          - backend:
              service:
                name: ax-server
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - ax.k3s.lan
      secretName: ax-server-tls
