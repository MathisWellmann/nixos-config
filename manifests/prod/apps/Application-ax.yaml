apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  name: ax
  namespace: argocd
spec:
  destination:
    namespace: ax-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/prod/ax
    repoURL: https://github.com/MathisWellmann/nixos-config.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
